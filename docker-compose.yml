services:
  api:
    build:
      context: ./backend
    environment:
      RAILS_ENV: development
      FRONTEND_ORIGIN: http://localhost:5173
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - bundle_cache:/usr/local/bundle
    command: >
      bash -lc "mkdir -p storage && bundle exec rails db:prepare db:seed &&
      bundle exec puma -C config/puma.rb"
    healthcheck:
      test:
        - CMD
        - ruby
        - -rnet/http
        - -e
        - "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/up')).is_a?(Net::HTTPSuccess) ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "5173:5173"
    command: sh -lc "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --strictPort"
    depends_on:
      api:
        condition: service_healthy

volumes:
  bundle_cache:
  node_modules:
