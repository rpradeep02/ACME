services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  api:
    build: ./backend
    environment:
      RAILS_ENV: development
      FRONTEND_ORIGIN: http://localhost:5173
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - bundle_cache:/usr/local/bundle
    command: bash -lc "bundle exec rails db:prepare db:seed && bundle exec puma -C config/puma.rb"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    environment:
      RAILS_ENV: development
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - bundle_cache:/usr/local/bundle
    command: bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      redis:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "5173:5173"
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

volumes:
  bundle_cache:
  node_modules:
  redis_data:
