services:
  api:
    build: ./backend
    environment:
      RAILS_ENV: development
      FRONTEND_ORIGIN: http://localhost:5173
      SEED_ADMIN_PASSWORD: ChangeMe123!
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - bundle_cache:/usr/local/bundle
    command: bash -lc "bundle exec rails db:prepare db:seed && bundle exec puma -C config/puma.rb"
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "5173:5173"
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api
volumes:
  bundle_cache:
  node_modules:
